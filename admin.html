<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portfólio | Cursi Tattoo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: var(--fundo);
        }
        .admin-card {
            background: var(--card);
            border-top: 4px solid var(--vinho);
            border-radius: 8px;
            padding: 36px 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .admin-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .admin-card h2 {
            font-size: 1.8rem;
            color: #fff;
            margin: 0;
        }
        .admin-form {
            display: grid;
            gap: 16px;
        }
        .admin-form label {
            display: grid;
            gap: 6px;
            font-size: 0.95rem;
            color: var(--texto-suave);
        }
        .admin-form input[type="text"],
        .admin-form input[type="password"],
        .admin-form input[type="file"] {
            width: 100%;
            padding: 12px;
            background: var(--fundo);
            border: 2px solid var(--borda);
            border-radius: 4px;
            color: #fff;
            font-family: inherit;
        }
        .admin-form input:focus {
            outline: none;
            border-color: var(--laranja);
        }
        .tinypng-box {
            background: rgba(197, 91, 17, 0.12);
            border: 1px solid var(--laranja);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tinypng-box p {
            font-size: 0.9rem;
            color: var(--texto);
            margin: 0;
        }
        .btn-tiny {
            display: inline-block;
            text-align: center;
            background: #2e2e2e;
            color: var(--laranja-claro);
            border: 1px solid var(--laranja);
            padding: 8px 14px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-tiny:hover {
            background: var(--laranja);
            color: #fff;
        }
        .preview-img {
            max-height: 220px;
            width: auto;
            margin: 0 auto;
            border-radius: 4px;
            border: 2px solid var(--borda);
            display: none;
        }
        .status-msg {
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }
        .status-msg.erro {
            display: block;
            background: rgba(130, 0, 0, 0.35);
            border: 1px solid var(--vinho);
            color: #ff9999;
        }
        .status-msg.sucesso {
            display: block;
            background: rgba(0, 200, 83, 0.15);
            border: 1px solid #00c853;
            color: #69f0ae;
        }
        .status-msg.info {
            display: block;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--borda);
            color: var(--texto);
        }
        .btn-acao-topo {
            display: flex;
            gap: 10px;
        }
        .btn-sair, .btn-voltar-site {
            background: none;
            border: 1px solid var(--borda);
            color: var(--texto-suave);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .btn-sair:hover, .btn-voltar-site:hover {
            border-color: var(--vinho);
            color: #fff;
        }
        .checkbox-linha {
            display: flex !important;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .checkbox-linha input {
            width: auto !important;
        }
        .abas {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--borda);
            padding-bottom: 10px;
        }
        .aba-btn {
            background: none;
            border: none;
            color: var(--texto-suave);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 4px;
        }
        .aba-btn.ativo {
            background: var(--vinho);
            color: #fff;
        }
        .lista-gerenciar {
            display: grid;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .item-gerenciar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--fundo);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--borda);
        }
        .item-gerenciar img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }
        .item-gerenciar input {
            flex: 1;
            padding: 8px;
            background: var(--card);
            border: 1px solid var(--borda);
            color: #fff;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .btn-apagar {
            background: var(--vinho);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-apagar:hover {
            background: #a30000;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div class="admin-card" id="tela-login">
        <div class="admin-topo">
            <h2>Acesso Restrito</h2>
        </div>
        <form class="admin-form" id="form-login">
            <div id="msg-login" class="status-msg"></div>
            <label>Usuário
                <input type="text" id="login-usuario" required autocomplete="username">
            </label>
            <label>Senha
                <input type="password" id="login-senha" required autocomplete="current-password">
            </label>
            <button type="submit" class="btn btn--cta" style="width: 100%;">Entrar no Painel</button>
        </form>
    </div>

    <!-- PAINEL DE ADMINISTRAÇÃO -->
    <div class="admin-card" id="tela-painel" style="display: none;">
        <div class="admin-topo">
            <h2>Painel Admin</h2>
            <div class="btn-acao-topo">
                <a href="index.html" class="btn-voltar-site">Ver Site</a>
                <button type="button" class="btn-sair" id="btn-sair">Sair</button>
            </div>
        </div>

        <div class="abas">
            <button type="button" class="aba-btn ativo" id="tab-novo" onclick="trocarAba('novo')">Novo Trabalho</button>
            <button type="button" class="aba-btn" id="tab-gerenciar" onclick="trocarAba('gerenciar')">Gerenciar Fotos</button>
        </div>

        <!-- ABA 1: NOVO TRABALHO -->
        <div id="conteudo-novo">
            <div class="tinypng-box">
                <p><strong>1º Passo (Opcional):</strong> Comprima sua foto para o site carregar mais rápido:</p>
                <a href="https://tinypng.com/" target="_blank" rel="noopener" class="btn-tiny">
                    Abrir TinyPNG para otimizar imagem ↗
                </a>
            </div>

            <form class="admin-form" id="form-upload">
                <div id="msg-upload" class="status-msg"></div>

                <label>2º Passo: Selecione a imagem do trabalho
                    <input type="file" id="arquivo-imagem" accept="image/*" required>
                </label>

                <img id="preview" class="preview-img" alt="Pré-visualização">

                <label class="checkbox-linha">
                    <input type="checkbox" id="otimizar-auto" checked>
                    <span>Otimizar tamanho automaticamente antes de enviar</span>
                </label>

                <button type="submit" class="btn btn--cta" id="btn-enviar" style="width: 100%;">
                    Postar no Site
                </button>
            </form>
        </div>

        <!-- ABA 2: GERENCIAR FOTOS -->
        <div id="conteudo-gerenciar" style="display: none;">
            <div id="msg-gerenciar" class="status-msg"></div>
            <p style="font-size: 0.9rem; color: var(--texto-suave); margin-bottom: 12px;">Aqui você pode apagar fotos do portfólio:</p>
            <div class="lista-gerenciar" id="lista-gerenciar">
                <p style="text-align: center; color: var(--texto-suave);">Carregando imagens...</p>
            </div>
        </div>
    </div>

    <script>
        const LOGIN_ADMIN = {
            usuario: "cursi",
            senha: "1010@"
        };

        const DADOS_GITHUB = {
            usuario: "rafaeddd",
            repositorio: "portfolio-tatuagem",
            branch: "main",
            pasta: "portifolio",
            token: "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"
        };

        const telaLogin = document.getElementById("tela-login");
        const telaPainel = document.getElementById("tela-painel");
        const msgLogin = document.getElementById("msg-login");
        const msgUpload = document.getElementById("msg-upload");
        const msgGerenciar = document.getElementById("msg-gerenciar");
        const inputArquivo = document.getElementById("arquivo-imagem");
        const previewImg = document.getElementById("preview");
        const listaGerenciarDiv = document.getElementById("lista-gerenciar");

        if (sessionStorage.getItem("cursi_admin_logado") === "true") {
            mostrarPainel();
        }

        function mostrarPainel() {
            telaLogin.style.display = "none";
            telaPainel.style.display = "block";
        }

        function trocarAba(aba) {
            document.getElementById("tab-novo").classList.toggle("ativo", aba === 'novo');
            document.getElementById("tab-gerenciar").classList.toggle("ativo", aba === 'gerenciar');
            document.getElementById("conteudo-novo").style.display = aba === 'novo' ? 'block' : 'none';
            document.getElementById("conteudo-gerenciar").style.display = aba === 'gerenciar' ? 'block' : 'none';
            if (aba === 'gerenciar') {
                carregarListaGerenciamento();
            }
        }

        document.getElementById("form-login").addEventListener("submit", (e) => {
            e.preventDefault();
            const user = document.getElementById("login-usuario").value.trim();
            const pass = document.getElementById("login-senha").value;

            if (user === LOGIN_ADMIN.usuario && pass === LOGIN_ADMIN.senha) {
                sessionStorage.setItem("cursi_admin_logado", "true");
                msgLogin.className = "status-msg";
                mostrarPainel();
            } else {
                msgLogin.textContent = "Usuário ou senha incorretos.";
                msgLogin.className = "status-msg erro";
            }
        });

        document.getElementById("btn-sair").addEventListener("click", () => {
            sessionStorage.removeItem("cursi_admin_logado");
            telaPainel.style.display = "none";
            telaLogin.style.display = "block";
        });

        inputArquivo.addEventListener("change", () => {
            const file = inputArquivo.files[0];
            if (file) {
                previewImg.src = URL.createObjectURL(file);
                previewImg.style.display = "block";
            } else {
                previewImg.style.display = "none";
            }
        });

        function prepararImagemBase64(file, otimizar) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    if (!otimizar) {
                        resolve(event.target.result.split(",")[1]);
                        return;
                    }
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        const MAX_LARGURA = 1200;
                        let largura = img.width;
                        let altura = img.height;

                        if (largura > MAX_LARGURA) {
                            altura = Math.round((altura * MAX_LARGURA) / largura);
                            largura = MAX_LARGURA;
                        }

                        canvas.width = largura;
                        canvas.height = altura;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, largura, altura);

                        resolve(canvas.toDataURL("image/jpeg", 0.82).split(",")[1]);
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function obterProximoNumero(token) {
            const url = `https://api.github.com/repos/${DADOS_GITHUB.usuario}/${DADOS_GITHUB.repositorio}/contents/${DADOS_GITHUB.pasta}?ref=${DADOS_GITHUB.branch}`;
            const resposta = await fetch(url, {
                headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json" }
            });

            if (resposta.status === 404) return 1;
            if (!resposta.ok) throw new Error("Erro ao acessar o GitHub.");

            const dados = await resposta.json();
            if (!Array.isArray(dados)) return 1;

            let maiorNumero = 0;
            dados.forEach(item => {
                const match = item.name.match(/^(\d+)\.jpeg$/i);
                if (match) {
                    const num = parseInt(match[1], 10);
                    if (num > maiorNumero) maiorNumero = num;
                }
            });
            return maiorNumero + 1;
        }

        // Envio de nova foto com redirecionamento automático
        document.getElementById("form-upload").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btnEnviar = document.getElementById("btn-enviar");
            const file = inputArquivo.files[0];
            const otimizar = document.getElementById("otimizar-auto").checked;

            if (!file) return;

            btnEnviar.disabled = true;
            btnEnviar.textContent = "Enviando...";
            msgUpload.textContent = "Calculando próximo número e enviando para o GitHub...";
            msgUpload.className = "status-msg info";

            try {
                const proximoNumero = await obterProximoNumero(DADOS_GITHUB.token);
                const nomeArquivo = `${proximoNumero}.jpeg`;
                const conteudoBase64 = await prepararImagemBase64(file, otimizar);

                const urlUpload = `https://api.github.com/repos/${DADOS_GITHUB.usuario}/${DADOS_GITHUB.repositorio}/contents/${DADOS_GITHUB.pasta}/${nomeArquivo}`;

                const respostaUpload = await fetch(urlUpload, {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${DADOS_GITHUB.token}`,
                        "Accept": "application/vnd.github.v3+json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Adiciona ${nomeArquivo} ao portfólio via painel`,
                        content: conteudoBase64,
                        branch: DADOS_GITHUB.branch
                    })
                });

                if (!respostaUpload.ok) throw new Error("Erro ao enviar imagem.");

                msgUpload.innerHTML = `<strong>Sucesso!</strong> Foto ${nomeArquivo} postada. Redirecionando para o site...`;
                msgUpload.className = "status-msg sucesso";

                // Redireciona para o index.html após 2 segundos
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);

            } catch (erro) {
                msgUpload.textContent = `Erro: ${erro.message}`;
                msgUpload.className = "status-msg erro";
                btnEnviar.disabled = false;
                btnEnviar.textContent = "Postar no Site";
            }
        });

        // Carregar lista de imagens para gerenciar/apagar
        async function carregarListaGerenciamento() {
            listaGerenciarDiv.innerHTML = `<p style="text-align: center; color: var(--texto-suave);">Carregando fotos...</p>`;
            try {
                const url = `https://api.github.com/repos/${DADOS_GITHUB.usuario}/${DADOS_GITHUB.repositorio}/contents/${DADOS_GITHUB.pasta}?ref=${DADOS_GITHUB.branch}`;
                const resposta = await fetch(url, {
                    headers: { "Authorization": `Bearer ${DADOS_GITHUB.token}`, "Accept": "application/vnd.github.v3+json" }
                });

                if (!resposta.ok) throw new Error("Não foi possível carregar as fotos.");
                const arquivos = await resposta.json();

                const fotos = arquivos.filter(item => item.name.match(/\.(jpeg|jpg|png)$/i));
                
                if (fotos.length === 0) {
                    listaGerenciarDiv.innerHTML = `<p style="text-align: center; color: var(--texto-suave);">Nenhuma foto encontrada na pasta.</p>`;
                    return;
                }

                listaGerenciarDiv.innerHTML = "";
                fotos.forEach(foto => {
                    const item = document.createElement("div");
                    item.className = "item-gerenciar";

                    const img = document.createElement("img");
                    img.src = foto.download_url;

                    const nomeSpan = document.createElement("span");
                    nomeSpan.style.flex = "1";
                    nomeSpan.style.fontWeight = "600";
                    nomeSpan.textContent = foto.name;

                    const btnApagar = document.createElement("button");
                    btnApagar.type = "button";
                    btnApagar.className = "btn-apagar";
                    btnApagar.textContent = "Apagar";
                    btnApagar.onclick = () => apagarFoto(foto.name, foto.sha);

                    item.append(img, nomeSpan, btnApagar);
                    listaGerenciarDiv.appendChild(item);
                });

            } catch (erro) {
                msgGerenciar.textContent = erro.message;
                msgGerenciar.className = "status-msg erro";
            }
        }

        // Função para deletar a foto do GitHub
        async function apagarFoto(nomeArquivo, shaArquivo) {
            if (!confirm(`Tem certeza que deseja apagar a foto ${nomeArquivo} do site?`)) return;

            msgGerenciar.textContent = `Apagando ${nomeArquivo}...`;
            msgGerenciar.className = "status-msg info";

            try {
                const urlDelete = `https://api.github.com/repos/${DADOS_GITHUB.usuario}/${DADOS_GITHUB.repositorio}/contents/${DADOS_GITHUB.pasta}/${nomeArquivo}`;
                
                const resposta = await fetch(urlDelete, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${DADOS_GITHUB.token}`,
                        "Accept": "application/vnd.github.v3+json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Remove ${nomeArquivo} via painel admin`,
                        sha: shaArquivo,
                        branch: DADOS_GITHUB.branch
                    })
                });

                if (!resposta.ok) throw new Error("Erro ao apagar arquivo.");

                msgGerenciar.textContent = `Foto ${nomeArquivo} apagada com sucesso!`;
                msgGerenciar.className = "status-msg sucesso";
                carregarListaGerenciamento(); // Atualiza a lista

            } catch (erro) {
                msgGerenciar.textContent = `Erro ao apagar: ${erro.message}`;
                msgGerenciar.className = "status-msg erro";
            }
        }
    </script>
</body>
</html>
